name: Build Rsenger Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  build-android:

    runs-on: ubuntu-22.04


    steps:

      # --------------------------------
      # 1. Checkout project
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup host Python
      # --------------------------------
      #
      # This is the Python used by
      # Buildozer on GitHub Actions.
      #
      # Android Python is separately
      # pinned inside buildozer.spec.
      #
      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # --------------------------------
      # 3. Setup Java
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 4. Install Linux dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint


      # --------------------------------
      # 5. Install Rust
      # --------------------------------
      - name: Install Rust
        run: |

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      # --------------------------------
      # 6. Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install --upgrade buildozer


      # --------------------------------
      # 7. Build APK
      # --------------------------------
      - name: Build APK
        run: |

          buildozer android debug


      # --------------------------------
      # 8. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Rsenger-Premium-APK

          path: bin/*.apk

          if-no-files-found: error
