name: Rsenger Android APK

on:
  workflow_dispatch:

jobs:

  build-android:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. LINUX DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint


      # ==========================================
      # 5. RUST
      # ==========================================

      - name: Install Rust
        run: |

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      # ==========================================
      # 6. PYTHON BUILD TOOLS
      # ==========================================

      - name: Install Python build tools
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            setuptools \
            wheel \
            "cython<3.4"


      # ==========================================
      # 7. BUILDOZER
      # ==========================================

      - name: Install Buildozer
        run: |

          python -m pip install \
            "buildozer"


      # ==========================================
      # 8. CHECK ENVIRONMENT
      # ==========================================

      - name: Check environment
        run: |

          echo "================================"
          echo "Python"
          echo "================================"

          python --version

          echo "================================"
          echo "Java"
          echo "================================"

          java -version

          echo "================================"
          echo "Buildozer"
          echo "================================"

          buildozer --version


      # ==========================================
      # 9. BUILD APK
      # ==========================================

      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

        run: |

          buildozer android debug


      # ==========================================
      # 10. SHOW APK
      # ==========================================

      - name: Check APK
        run: |

          echo "================================"
          echo "APK FILES"
          echo "================================"

          ls -lah bin/

          echo "================================"
          echo "APK PATH"
          echo "================================"

          find bin -type f -name "*.apk" -print


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Rsenger-APK

          path: bin/*.apk

          if-no-files-found: error
