name: Rsenger Android APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==============================
      # PYTHON FOR BUILDOZER
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==============================
      # JAVA 17
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ==============================
      # ANDROID / BUILDOZER DEPENDENCIES
      # ==============================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint


      # ==============================
      # RUST
      # ==============================
      - name: Install Rust
        run: |
          curl --proto '=https' \
               --tlsv1.2 \
               -sSf https://sh.rustup.rs \
               | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"


      # ==============================
      # UPDATE PIP TOOLS
      # ==============================
      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ==============================
      # INSTALL BUILDOZER
      # ==============================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer


      # ==============================
      # SHOW ENVIRONMENT
      # ==============================
      - name: Check build environment
        run: |
          python --version
          pip --version
          buildozer --version
          java -version


      # ==============================
      # BUILD APK
      # ==============================
      - name: Build Android Debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug


      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rsenger-APK
          path: bin/*.apk
          if-no-files-found: error
